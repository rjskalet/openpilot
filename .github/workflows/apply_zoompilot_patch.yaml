name: Apply ZoomPilot integration patch

on:
  push:
    branches:
      - 'starpilot/cx9-zoompilot-architecture'
    paths:
      - '.github/zoompilot-patches/**'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply reviewed integration patch
        run: python .github/zoompilot-patches/controlsd.patch
      - name: Remove one-shot patcher
        run: |
          git rm .github/zoompilot-patches/controlsd.patch
          git rm .github/workflows/apply_zoompilot_patch.yaml
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add selfdrive/controls/controlsd.py
          git commit -m 'Mazda: wire ZoomPilot v2 controller into StarPilot'
          git push origin HEAD:${{ github.ref_name }}
